<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerCy Side Studio + Python</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/eclipse.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/matchesonscrollbar.css">
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://unpkg.com/prettier@2.8.8/standalone.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-html.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-postcss.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-babel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://emmet.io/js/emmet.js"></script>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <style>
        /* --- REDESIGN UI: THEME CONFIGURATION --- */
        :root {
            --bg-primary: #0f172a;       
            --bg-secondary: #1e293b;     
            --bg-tertiary: #334155;      
            --accent: #0ea5e9;           
            --accent-hover: #0284c7;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --glass: rgba(15, 23, 42, 0.9);
            --item-hover: rgba(255, 255, 255, 0.08);
            --splash-bg: #020617;
            --tab-active-bg: #1e293b;
            --panel-left-width: 250px;
            --panel-right-width: 500px;
        }

        body.light-mode {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            --accent: #0284c7;
            --text-main: #0f172a;
            --text-dim: #64748b;
            --border: #cbd5e1;
            --glass: rgba(255, 255, 255, 0.95);
            --item-hover: rgba(0, 0, 0, 0.05);
            --splash-bg: #ffffff;
            --tab-active-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.2s ease, color 0.2s ease; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; inset: 0; background-color: var(--splash-bg); z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }
        .splash-logo { font-size: 3rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; animation: pulse 2s infinite; }
        .splash-logo span { color: var(--accent); }
        .loading-bar { width: 200px; height: 3px; background: rgba(128,128,128,0.2); border-radius: 2px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: var(--accent); animation: load 2s ease-in-out forwards; }
        .splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes pulse { 50% { opacity: 0.7; } }

        /* --- HEADER --- */
        header {
            height: 60px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background: var(--glass); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; gap: 15px; }
        
        .toggle-btn {
            font-size: 1.2rem; color: var(--text-dim); cursor: pointer; padding: 5px;
            transition: all 0.2s;
        }
        .toggle-btn:hover, .toggle-btn.active { color: var(--accent); transform: scale(1.1); }

        .logo { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .logo i { filter: drop-shadow(0 0 5px var(--accent-glow)); }
        .logo span { color: var(--accent); }
        
        .controls { display: flex; gap: 8px; align-items: center; }

        .btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-dim);
            height: 36px; padding: 0 12px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; position: relative;
            font-size: 0.9rem; transition: all 0.2s;
        }
        .btn:hover { background: var(--item-hover); border-color: var(--text-dim); color: var(--text-main); }
        .btn-text { width: auto; padding: 0 15px; gap: 8px; font-weight: 500; }
        
        /* Run Button Style */
        .btn-run { 
            background: linear-gradient(135deg, var(--accent), #2563eb); 
            color: white; border: none; font-weight: 700;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .btn-run:hover { 
            background: linear-gradient(135deg, #2563eb, var(--accent));
            box-shadow: 0 0 20px var(--accent-glow); opacity: 1; color: white;
        }
        
        .recording-dot {
            width: 10px; height: 10px; background: red; border-radius: 50%;
            display: none; animation: blink-rec 1s infinite; margin-right: 5px;
        }
        @keyframes blink-rec { 50% { opacity: 0; } }

        /* --- WORKSPACE LAYOUT --- */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* Sidebar */
        .sidebar {
            width: var(--panel-left-width); 
            background: var(--bg-primary); 
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden; white-space: nowrap;
        }
        .sidebar.collapsed { width: 0; border-right: none; }

        .sidebar-header {
            padding: 15px 20px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); flex-shrink: 0; font-weight: 700;
        }
        .file-list { list-style: none; padding: 10px; overflow-y: auto; flex: 1; }
        .file-item {
            padding: 10px 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
            cursor: pointer; border-radius: 6px; font-size: 0.9rem; color: var(--text-dim);
            border: 1px solid transparent;
        }
        .file-item:hover { background: var(--item-hover); color: var(--text-main); }
        .file-item.active { 
            background: rgba(14, 165, 233, 0.15); 
            color: var(--accent); 
            border-color: rgba(14, 165, 233, 0.3);
        }
        
        .file-icon { width: 15px; text-align: center; }
        .file-actions { margin-left: auto; display: none; gap: 5px; }
        .file-item:hover .file-actions { display: flex; }
        .delete-btn { color: var(--danger); font-size: 0.8rem; padding: 2px; }

        /* --- MAIN AREA --- */
        .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; }
        
        .tab-bar {
            height: 40px; background: var(--bg-primary); display: flex; align-items: flex-end;
            padding-left: 0; border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0;
        }
        .tab {
            height: 100%; padding: 0 20px; display: flex; align-items: center; gap: 8px;
            font-size: 0.85rem; color: var(--text-dim); border-right: 1px solid var(--border);
            cursor: pointer; background: var(--bg-primary); position: relative; user-select: none;
            min-width: 140px; border-top: 2px solid transparent;
        }
        .tab.active { background: var(--bg-secondary); color: var(--text-main); border-top: 2px solid var(--accent); }
        .tab-close { margin-left: auto; font-size: 0.7rem; opacity: 0; border-radius: 50%; padding: 4px; }
        .tab:hover .tab-close { opacity: 1; }
        .tab-close:hover { background: var(--danger); color: white; }

        /* EDITOR CONTAINER */
        .editor-wrapper { flex: 1; position: relative; display: flex; overflow: hidden; background: var(--bg-primary); }
        .editor-container { flex: 1; position: relative; overflow: hidden; }
        
        .minimap-container {
            width: 80px; background: var(--bg-primary); border-left: 1px solid var(--border);
            position: relative; overflow: hidden; user-select: none; cursor: default;
            flex-shrink: 0; display: none; 
        }
        @media (min-width: 768px) { .minimap-container { display: block; } }
        .minimap-content {
            transform: scale(0.15); transform-origin: top left;
            width: 666%; height: 100%; pointer-events: none;
        }

        .CodeMirror { height: 100% !important; font-family: 'JetBrains Mono', monospace; font-size: 14px; background: transparent !important; }
        
        .CodeMirror-dialog {
            background: var(--bg-secondary) !important; color: var(--text-main) !important;
            border-bottom: 1px solid var(--border); padding: 5px 10px !important;
        }
        .CodeMirror-dialog input {
            background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-main);
            outline: none; border-radius: 4px; padding: 2px 5px;
        }

        /* --- PREVIEW & CONSOLE AREA --- */
        .preview-container {
            width: var(--panel-right-width); 
            border-left: 1px solid var(--border); display: flex; flex-direction: column;
            background: var(--bg-secondary); overflow: hidden; flex-shrink: 0;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .preview-container.collapsed { width: 0; border-left: none; }

        .preview-header {
            padding: 10px 15px; background: var(--bg-primary); color: var(--text-dim);
            font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); flex-shrink: 0; font-weight: bold;
        }
        .preview-header span i { margin-right: 5px; }

        iframe { flex: 1; border: none; width: 100%; background: #fff; }
        
        /* CONSOLE */
        .console-panel {
            height: 180px; background: #0b1120; border-top: 1px solid var(--border);
            display: flex; flex-direction: column; font-family: 'JetBrains Mono', monospace; flex-shrink: 0;
        }
        .console-header {
            padding: 8px 15px; background: #1e293b; color: var(--text-dim); font-size: 0.75rem;
            display: flex; justify-content: space-between; border-bottom: 1px solid var(--border);
        }
        .console-body { flex: 1; overflow-y: auto; padding: 10px; font-size: 0.85rem; color: #eee; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #1e293b; padding-bottom: 2px; }
        .log-entry.error { color: #ff6b6b; }
        .log-entry.warn { color: #feca57; }
        .log-entry.log { color: #2ecc71; }
        .log-entry.system { color: #0ea5e9; font-weight: bold; }
        .log-time { color: #64748b; font-size: 0.7rem; margin-right: 8px; }

        /* Footer */
        footer {
            height: 30px; background: var(--bg-primary); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            font-size: 0.75rem; color: var(--text-dim); z-index: 50; flex-shrink: 0;
        }

        /* ZEN MODE */
        body.zen-mode header, body.zen-mode footer, body.zen-mode .sidebar, body.zen-mode .tab-bar, body.zen-mode .console-panel { display: none !important; }
        body.zen-mode .workspace { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; }
        body.zen-mode .preview-container { width: 50%; }
        body.zen-mode .preview-container.collapsed { width: 0; } 
        body.zen-mode #exit-zen-btn { display: block; }
        
        #exit-zen-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 10000;
            background: var(--accent); color: white; padding: 10px 20px;
            border-radius: 30px; border: none; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow); display: none;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal {
            background: var(--bg-secondary); padding: 25px; border-radius: 12px; width: 400px;
            border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal h3 { margin-bottom: 20px; font-size: 1.2rem; color: var(--accent); }
        .modal input, .modal select {
            width: 100%; padding: 10px; margin-bottom: 15px; background: var(--bg-primary);
            border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; outline: none;
        }
        .modal input:focus, .modal select:focus { border-color: var(--accent); }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }

        @media (max-width: 768px) {
            .workspace { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .preview-container { width: 100%; height: 350px; border-left: none; border-top: 1px solid var(--border); }
            .btn-text span { display: none; }
            .btn-text { width: 35px; padding: 0; }
            .minimap-container { display: none; }
            .toggle-btn { display: none; }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo"><i class="fas fa-layer-group"></i> FerCy <span>Side Studio</span></div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <div style="margin-top: 10px; color: var(--text-dim); font-size: 0.8rem;">Memuat Python Engine...</div>
    </div>

    <button id="exit-zen-btn" onclick="toggleZenMode()"><i class="fas fa-expand-arrows-alt"></i> Exit Zen Mode</button>

    <div class="modal-overlay" id="file-modal">
        <div class="modal">
            <h3>Buat File Baru</h3>
            <label style="font-size:0.8rem; color:var(--text-dim)">Nama File:</label>
            <input type="text" id="new-filename" placeholder="contoh: script.py atau index.html">
            
            <label style="font-size:0.8rem; color:var(--text-dim)">Template Starter:</label>
            <select id="template-select">
                <option value="blank">Kosong (Blank)</option>
                <option value="python">Python Basic 🐍</option>
                <option value="bootstrap">Bootstrap 5 CDN</option>
                <option value="tailwind">Tailwind CSS CDN</option>
                <option value="basic">HTML5 Boilerplate</option>
            </select>

            <div class="modal-btns">
                <button class="btn" onclick="closeModal()">Batal</button>
                <button class="btn btn-run" onclick="confirmNewFile()" style="width: auto; padding: 0 15px;">Buat</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <i class="fas fa-bars toggle-btn" id="toggle-left-btn" title="Toggle Explorer"></i>
            
            <div class="logo">
                <i class="fas fa-layer-group" style="color: var(--accent);"></i>
                FerCy <span>Side</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-text" id="record-btn" title="Rekam Layar Coding">
                <div class="recording-dot"></div>
                <i class="fas fa-video"></i> <span>Rec</span>
            </button>

            <button class="btn" id="zen-btn" title="Zen Mode (Focus)" onclick="toggleZenMode()">
                <i class="fas fa-expand"></i>
            </button>

            <button class="btn btn-text" id="zip-btn" title="Export Project to ZIP">
                <i class="fas fa-file-archive"></i> <span>ZIP</span>
            </button>

            <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>

            <button class="btn btn-text" id="format-btn" title="Format Code">
                <i class="fas fa-broom"></i> <span>Format</span>
            </button>
            
            <button class="btn btn-text" id="add-file-btn" title="Tambah File Baru">
                <i class="fas fa-plus"></i> <span>Baru</span>
            </button>
            
            <button class="btn" id="theme-btn" title="Ganti Tema"><i class="fas fa-moon"></i></button>
            
            <button class="btn btn-run btn-text" id="run-btn">
                <i class="fas fa-play"></i> <span>RUN</span>
            </button>
            
            <i class="fas fa-columns toggle-btn" id="toggle-right-btn" title="Toggle Preview" style="margin-left: 10px;"></i>
        </div>
    </header>

    <div class="workspace">
        
        <aside class="sidebar" id="sidebar-panel">
            <div class="sidebar-header">
                <span>Explorer</span>
                <i class="fas fa-folder-open"></i>
            </div>
            <ul class="file-list" id="file-list-container"></ul>
        </aside>

        <div class="main-area">
            <div class="tab-bar" id="tab-bar-container"></div>
            
            <div class="editor-wrapper">
                <div class="editor-container">
                    <textarea id="code-editor"></textarea>
                </div>
                <div class="minimap-container">
                    <div class="minimap-content" id="minimap-content"></div>
                </div>
            </div>
        </div>

        <div class="preview-container" id="preview-panel">
            <div class="preview-header">
                <span id="output-label"><i class="fas fa-globe"></i> Web Browser Preview</span>
                <i class="fas fa-sync-alt" onclick="document.getElementById('run-btn').click()" style="cursor: pointer;" title="Refresh"></i>
            </div>
            <iframe id="web-preview"></iframe>
            
            <div class="console-panel" id="custom-console">
                <div class="console-header">
                    <span><i class="fas fa-terminal"></i> Console Output</span>
                    <i class="fas fa-trash" style="cursor: pointer;" title="Clear" onclick="clearConsole()"></i>
                </div>
                <div class="console-body" id="console-logs">
                    <div class="log-entry system"><span class="log-time">System</span> Initializing Environment...</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="left" id="status-bar" style="display: flex; gap: 15px;">
            <span><i class="fas fa-code-branch"></i> main</span>
            <span id="status-text">Ready</span>
        </div>
        <div class="right" id="python-status"><i class="fas fa-circle-notch fa-spin"></i> Loading Python...</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/xml-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/jump-to-line.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/codemirror-emmet@1.0.6/dist/codemirror-emmet.min.js"></script>

    <script>
        const STORAGE_KEY = 'fercy_v3_ultimate';
        
        let savedData = localStorage.getItem(STORAGE_KEY);
        // Default file ada Python juga
        let files = savedData ? JSON.parse(savedData) : [
            { 
                id: 1, name: 'index.html', lang: 'htmlmixed', 
                content: '<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { background: #0f172a; color: #0ea5e9; font-family: sans-serif; text-align: center; padding-top: 50px; }\n  </style>\n</head>\n<body>\n  <h1>FerCy Side Studio</h1>\n  <p>Coba fitur Emmet: ketik div.box>ul>li*3 lalu tekan TAB!</p>\n  <script>\n    console.log("Console is active!");\n  <\/script>\n</body>\n</html>' 
            },
            {
                id: 2, name: 'main.py', lang: 'python',
                content: '# Contoh Kode Python di FerCy\n\ndef sapa_fercy(nama):\n    return f"Halo {nama}, selamat datang di FerCy OS Environment!"\n\nprint(sapa_fercy("User"))\n\n# Loop sederhana\nfor i in range(1, 6):\n    print(f"Looping ke-{i}")'
            }
        ];
        
        let activeFileId = files[0].id;
        let openFiles = [files[0].id];
        let mainEditor, minimapEditor; // Editor Instances
        let pyodideInstance = null; // Variable untuk menyimpan engine Python

        // --- INIT PYODIDE ENGINE (BARU) ---
        async function initPyodide() {
            try {
                pyodideInstance = await loadPyodide();
                document.getElementById('python-status').innerHTML = '<i class="fas fa-check-circle" style="color:#22c55e"></i> Python Ready';
                addToConsole('system', 'Python Engine (Pyodide) berhasil dimuat!');
                // Hide splash after python loads (or 1.5s whichever later)
            } catch (err) {
                document.getElementById('python-status').innerHTML = '<i class="fas fa-exclamation-triangle" style="color:red"></i> Python Error';
                addToConsole('error', 'Gagal memuat Pyodide: ' + err);
            }
        }

        // --- INIT EDITORS (Main + Minimap) ---
        document.addEventListener('DOMContentLoaded', () => {
            // Load Python Async
            initPyodide();

            setTimeout(() => { document.getElementById('splash-screen').classList.add('splash-hidden'); }, 1500);

            // 1. Main Editor Setup
            mainEditor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                lineNumbers: true,
                theme: 'dracula',
                mode: 'htmlmixed',
                autoCloseTags: true,
                autoCloseBrackets: true,
                extraKeys: {
                    "Ctrl-Space": "autocomplete",
                    "Tab": "emmetExpandAbbreviation",
                    "Esc": "emmetResetAbbreviation",
                    "Enter": "emmetInsertLineBreak",
                    "Ctrl-F": "findPersistent"
                },
                emmet: { preview: true }
            });

            // 2. Minimap Editor Setup
            minimapEditor = CodeMirror(document.getElementById('minimap-content'), {
                value: mainEditor.getValue(),
                mode: 'htmlmixed',
                theme: 'dracula',
                lineNumbers: false,
                readOnly: "nocursor",
                scrollbarStyle: "null"
            });

            // Sync Logic
            mainEditor.on('change', () => {
                const val = mainEditor.getValue();
                minimapEditor.setValue(val);
                const currentFile = files.find(f => f.id === activeFileId);
                if(currentFile) {
                    currentFile.content = val;
                    saveToStorage();
                }
            });

            mainEditor.on('scroll', () => {
                const info = mainEditor.getScrollInfo();
                const percentage = info.top / (info.height - info.clientHeight);
                const miniInfo = minimapEditor.getScrollInfo();
                minimapEditor.scrollTo(0, percentage * (miniInfo.height - miniInfo.clientHeight));
            });

            renderFileList();
            renderTabs();
            switchFile(activeFileId);
        });

        // --- SLIDING PANEL LOGIC ---
        const sidebarPanel = document.getElementById('sidebar-panel');
        const previewPanel = document.getElementById('preview-panel');
        const toggleLeftBtn = document.getElementById('toggle-left-btn');
        const toggleRightBtn = document.getElementById('toggle-right-btn');

        toggleLeftBtn.addEventListener('click', () => {
            sidebarPanel.classList.toggle('collapsed');
            toggleLeftBtn.classList.toggle('active');
            setTimeout(() => mainEditor.refresh(), 450);
        });

        toggleRightBtn.addEventListener('click', () => {
            previewPanel.classList.toggle('collapsed');
            toggleRightBtn.classList.toggle('active');
            setTimeout(() => mainEditor.refresh(), 450);
        });

        function saveToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(files)); }

        // --- FILE & TABS SYSTEM ---
        function getIconForFile(filename) {
            if(filename.endsWith('.py')) return '<i class="fab fa-python" style="color:#facc15"></i>';
            if(filename.endsWith('.css')) return '<i class="fab fa-css3" style="color:#3b82f6"></i>';
            if(filename.endsWith('.js')) return '<i class="fab fa-js" style="color:#f7df1e"></i>';
            return '<i class="fab fa-html5" style="color:#e34c26"></i>';
        }

        function renderFileList() {
            const container = document.getElementById('file-list-container');
            container.innerHTML = '';
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
                li.onclick = () => openFile(file.id);
                li.innerHTML = `<div class="file-icon">${getIconForFile(file.name)}</div><span>${file.name}</span>
                    <div class="file-actions"><i class="fas fa-trash delete-btn" onclick="deleteFile(event, ${file.id})"></i></div>`;
                container.appendChild(li);
            });
        }

        function renderTabs() {
            const container = document.getElementById('tab-bar-container');
            container.innerHTML = '';
            openFiles.forEach(id => {
                const file = files.find(f => f.id === id);
                if(!file) return;
                const tab = document.createElement('div');
                tab.className = `tab ${id === activeFileId ? 'active' : ''}`;
                tab.onclick = () => switchFile(id);
                tab.innerHTML = `${getIconForFile(file.name)} ${file.name} 
                    <i class="fas fa-times tab-close" onclick="closeTab(event, ${id})"></i>`;
                container.appendChild(tab);
            });
        }

        function openFile(id) {
            if(!openFiles.includes(id)) openFiles.push(id);
            switchFile(id);
        }

        function switchFile(id) {
            // Save prev
            const currentFile = files.find(f => f.id === activeFileId);
            if(currentFile && mainEditor) currentFile.content = mainEditor.getValue();

            activeFileId = id;
            const nextFile = files.find(f => f.id === activeFileId);
            if(nextFile && mainEditor) {
                mainEditor.setValue(nextFile.content);
                minimapEditor.setValue(nextFile.content);
                document.getElementById('status-text').innerText = `Editing: ${nextFile.name}`;

                // --- LOGIKA GANTI MODE EDITOR (PYTHON VS HTML) ---
                if (nextFile.name.endsWith('.py')) {
                    mainEditor.setOption("mode", "python");
                    minimapEditor.setOption("mode", "python");
                    document.getElementById('output-label').innerHTML = '<i class="fab fa-python"></i> Python Console Output';
                } else {
                    mainEditor.setOption("mode", "htmlmixed");
                    minimapEditor.setOption("mode", "htmlmixed");
                    document.getElementById('output-label').innerHTML = '<i class="fas fa-globe"></i> Web Browser Preview';
                }
            }
            renderFileList();
            renderTabs();
        }

        function closeTab(e, id) {
            e.stopPropagation();
            openFiles = openFiles.filter(fid => fid !== id);
            if(openFiles.length === 0 && files.length > 0) openFiles.push(files[0].id);
            if(activeFileId === id) switchFile(openFiles[openFiles.length - 1]);
            else renderTabs();
        }

        // --- ZEN MODE ---
        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            mainEditor.refresh();
        }

        // --- ZIP EXPORT ---
        document.getElementById('zip-btn').onclick = function() {
            const zip = new JSZip();
            const currentFile = files.find(f => f.id === activeFileId);
            if(currentFile) currentFile.content = mainEditor.getValue();

            files.forEach(file => { zip.file(file.name, file.content); });
            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "FerCy_Project.zip");
            });
        };

        // --- NEW FILE TEMPLATES ---
        const modal = document.getElementById('file-modal');
        const addBtn = document.getElementById('add-file-btn');
        const filenameInput = document.getElementById('new-filename');
        const templateSelect = document.getElementById('template-select');

        addBtn.onclick = () => { modal.style.display = 'flex'; filenameInput.focus(); }
        function closeModal() { modal.style.display = 'none'; filenameInput.value = ''; }

        const TEMPLATES = {
            'blank': '',
            'python': '# Tulis kode Python di sini\nprint("Hello from FerCy Python Engine!")\n',
            'basic': '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>Document</title>\n</head>\n<body>\n  <h1>Hello World</h1>\n</body>\n</html>',
            'bootstrap': '<!DOCTYPE html>\n<html>\n<head>\n  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">\n</head>\n<body class="p-5">\n  <div class="alert alert-primary">Hello Bootstrap!</div>\n</body>\n</html>',
            'tailwind': '<!DOCTYPE html>\n<html>\n<head>\n  <script src="https://cdn.tailwindcss.com"><\/script>\n</head>\n<body class="bg-gray-900 text-white flex items-center justify-center h-screen">\n  <h1 class="text-4xl font-bold">Hello Tailwind!</h1>\n</body>\n</html>'
        };

        function confirmNewFile() {
            const name = filenameInput.value.trim();
            const tmplKey = templateSelect.value;
            if(!name) return alert("Nama file tidak boleh kosong!");
            
            const newFile = { 
                id: Date.now(), 
                name: name, 
                lang: name.endsWith('.py') ? 'python' : 'htmlmixed', 
                content: TEMPLATES[tmplKey] || TEMPLATES['blank']
            };
            files.push(newFile);
            saveToStorage();
            closeModal();
            openFile(newFile.id);
        }

        // --- UTILS (Format, Delete, Console Helper) ---
        document.getElementById('format-btn').onclick = () => {
            try {
                const currentFile = files.find(f => f.id === activeFileId);
                let formatted;
                if(currentFile && currentFile.name.endsWith('.py')) {
                   alert("Maaf, Format otomatis belum tersedia untuk Python saat ini.");
                   return;
                } else {
                   formatted = prettier.format(mainEditor.getValue(), { parser: "html", plugins: prettierPlugins });
                }
                mainEditor.setValue(formatted);
            } catch(e) { alert("Code error, cannot format."); }
        };

        window.deleteFile = function(e, id) {
            e.stopPropagation(); 
            if(files.length <= 1) return alert("Minimal 1 file!");
            if(confirm('Hapus file?')) {
                files = files.filter(f => f.id !== id);
                closeTab(e, id);
                renderFileList();
                saveToStorage();
            }
        };

        // --- RUN LOGIC (UPDATED FOR PYTHON) ---
        document.getElementById('run-btn').onclick = async () => {
            const activeFile = files.find(f => f.id === activeFileId);
            activeFile.content = mainEditor.getValue();
            saveToStorage();

            clearConsole();

            // 1. JIKA FILE PYTHON (.py)
            if (activeFile.name.endsWith('.py')) {
                if (!pyodideInstance) {
                    addToConsole('warn', 'Python engine masih dimuat, mohon tunggu...');
                    return;
                }
                
                document.getElementById('web-preview').srcdoc = "<html><body style='color:#333; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh;'>Running Python... Check Console Below.</body></html>";
                addToConsole('system', 'Running Python Script...');
                
                try {
                    // Redirect Python print() to our HTML console
                    pyodideInstance.setStdout({ batched: (msg) => {
                        addToConsole('log', msg);
                    }});
                    
                    await pyodideInstance.runPythonAsync(activeFile.content);
                    addToConsole('system', 'Execution finished.');
                } catch (err) {
                    addToConsole('error', err);
                }

            } 
            // 2. JIKA FILE WEB (HTML/JS)
            else {
                const webPreview = document.getElementById('web-preview');
                const scriptInterception = `<script>
                    (function(){
                        const send = (type, args) => {
                            const msg = Array.from(args).join(' ');
                            window.parent.postMessage({source:'fercy', type, message:msg}, '*');
                        };
                        console.log = (...a) => send('log', a);
                        console.warn = (...a) => send('warn', a);
                        console.error = (...a) => send('error', a);
                        window.onerror = (m,u,l) => send('error', [m]);
                    })();
                <\/script>`;

                const doc = webPreview.contentWindow.document;
                doc.open();
                doc.write(scriptInterception + activeFile.content);
                doc.close();
            }
        };

        // Console Helper
        function addToConsole(type, message) {
            const logs = document.getElementById('console-logs');
            logs.innerHTML += `<div class="log-entry ${type}">[${type.toUpperCase()}] ${message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        window.addEventListener('message', (e) => {
            if(e.data && e.data.source === 'fercy') {
                addToConsole(e.data.type, e.data.message);
            }
        });
        
        function clearConsole() { document.getElementById('console-logs').innerHTML = ''; }

        let isDarkMode = true;
        document.getElementById('theme-btn').onclick = () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode');
            mainEditor.setOption('theme', isDarkMode ? 'dracula' : 'eclipse');
            minimapEditor.setOption('theme', isDarkMode ? 'dracula' : 'eclipse');
        };

        window.addEventListener('resize', () => mainEditor.refresh());
    </script>
</body>
</html>
