<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FerCy Side Studio - Mac Edition</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/eclipse.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://unpkg.com/prettier@2.8.8/standalone.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-html.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-postcss.js"></script>
    <script src="https://unpkg.com/prettier@2.8.8/parser-babel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://emmet.io/js/emmet.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror-emmet@1.0.6/dist/codemirror-emmet.min.js"></script>

    <style>
        /* --- MACOS UI THEME SYSTEM --- */
        :root {
            /* macOS Dark Mode Palette */
            --mac-bg-app: #1e1e1e;          /* Base Window Color */
            --mac-sidebar: rgba(40, 40, 40, 0.95); /* Sidebar Slightly Translucent */
            --mac-header: rgba(50, 50, 50, 0.8);   /* Header Glass */
            --mac-border: #383838;
            --mac-text-primary: #ffffff;
            --mac-text-secondary: #a1a1aa;
            
            --mac-accent: #0A84FF;          /* macOS System Blue */
            --mac-selection: rgba(10, 132, 255, 0.2);
            
            --traffic-red: #FF5F57;
            --traffic-yellow: #FEBC2E;
            --traffic-green: #28C840;

            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            
            --radius-app: 10px;
            --panel-left-width: 240px;
            --panel-right-width: 450px;
        }

        body.light-mode {
            --mac-bg-app: #ffffff;
            --mac-sidebar: #f5f5f7;
            --mac-header: rgba(255, 255, 255, 0.85);
            --mac-border: #d1d1d6;
            --mac-text-primary: #000000;
            --mac-text-secondary: #5a5a5c;
            --mac-accent: #007AFF;
            --mac-selection: rgba(0, 122, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.3); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(128, 128, 128, 0.5); }

        body {
            font-family: var(--font-ui);
            background-color: #000; /* Outer frame black */
            color: var(--mac-text-primary);
            height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden;
            font-size: 13px;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; inset: 0; background-color: #1a1a1a; z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }
        .splash-logo { font-size: 2.5rem; font-weight: 700; margin-bottom: 20px; color: #fff; letter-spacing: -0.5px; }
        .splash-logo span { color: var(--mac-accent); }
        .loading-bar { width: 180px; height: 4px; background: #333; border-radius: 10px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: var(--mac-accent); animation: load 2s ease-in-out forwards; border-radius: 10px; }
        .splash-hidden { opacity: 0; visibility: hidden; }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }

        /* --- HEADER (Unified Title Bar Style) --- */
        header {
            height: 52px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px; 
            background: var(--mac-header); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--mac-border); flex-shrink: 0; z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; gap: 20px; width: var(--panel-left-width); }
        
        /* Mac Traffic Lights */
        .mac-traffic-lights {
            display: flex; gap: 8px; margin-right: 10px;
        }
        .mac-dot { width: 12px; height: 12px; border-radius: 50%; transition: transform 0.1s; }
        .mac-red { background: var(--traffic-red); border: 0.5px solid #E0443E; }
        .mac-yellow { background: var(--traffic-yellow); border: 0.5px solid #DEA123; }
        .mac-green { background: var(--traffic-green); border: 0.5px solid #1AAB29; }
        .mac-traffic-lights:hover .mac-dot { opacity: 0.8; }

        .toggle-btn { color: var(--mac-text-secondary); cursor: pointer; font-size: 14px; }
        .toggle-btn:hover { color: var(--mac-text-primary); }

        .app-title {
            font-weight: 600; font-size: 13px; color: var(--mac-text-secondary); 
            position: absolute; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 8px;
        }
        
        .controls { display: flex; gap: 8px; align-items: center; }

        .btn {
            background: transparent; border: none; color: var(--mac-text-primary);
            height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; transition: background 0.2s; font-family: var(--font-ui);
        }
        .btn:hover { background: rgba(128,128,128, 0.2); }
        .btn i { font-size: 14px; }
        .btn-text span { margin-left: 6px; font-weight: 500; font-size: 12px; }
        
        /* Mac Button Style */
        .btn-run {
            background: transparent; color: var(--mac-accent);
        }
        .btn-run:hover { background: var(--mac-selection); }
        .btn-run i { margin-right: 4px; }

        .recording-dot {
            width: 8px; height: 8px; background: var(--traffic-red); border-radius: 50%;
            display: none; animation: blink-rec 1s infinite; margin-right: 6px;
        }
        @keyframes blink-rec { 50% { opacity: 0; } }

        /* --- WORKSPACE LAYOUT --- */
        .workspace { display: flex; flex: 1; overflow: hidden; background: var(--mac-bg-app); }
        
        /* Sidebar (Finder Style) */
        .sidebar {
            width: var(--panel-left-width); 
            background: var(--mac-sidebar); 
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--mac-border);
            display: flex; flex-direction: column; flex-shrink: 0;
            transition: width 0.3s ease;
            padding-top: 10px;
        }
        .sidebar.collapsed { width: 0; border-right: none; padding: 0; }

        .sidebar-header {
            padding: 0 16px 10px 16px; font-size: 11px; font-weight: 600; 
            color: var(--mac-text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .file-list { list-style: none; padding: 0 10px; overflow-y: auto; flex: 1; }
        .file-item {
            padding: 6px 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 2px;
            cursor: default; border-radius: 6px; font-size: 13px; color: var(--mac-text-primary);
        }
        /* Active State like Finder */
        .file-item.active { 
            background: var(--mac-accent); 
            color: white; 
        }
        .file-item:not(.active):hover { background: rgba(128,128,128, 0.15); }
        
        .file-icon { width: 16px; text-align: center; }
        .file-actions { margin-left: auto; display: none; }
        .file-item:hover .file-actions { display: block; }
        .delete-btn { color: inherit; opacity: 0.7; font-size: 12px; }
        .delete-btn:hover { opacity: 1; }

        /* --- MAIN AREA --- */
        .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        
        .tab-bar {
            height: 38px; background: var(--mac-bg-app); display: flex; align-items: center;
            padding-left: 10px; border-bottom: 1px solid var(--mac-border); overflow-x: auto;
        }
        .tab {
            padding: 4px 12px; display: flex; align-items: center; gap: 8px; margin-right: 4px;
            font-size: 12px; color: var(--mac-text-secondary); border-radius: 6px;
            cursor: pointer; user-select: none; transition: all 0.2s;
        }
        .tab:hover { background: rgba(128,128,128, 0.1); color: var(--mac-text-primary); }
        .tab.active { 
            background: rgba(128,128,128, 0.2); 
            color: var(--mac-text-primary); 
            font-weight: 500;
        }
        .tab-close { margin-left: 6px; font-size: 10px; opacity: 0; border-radius: 50%; padding: 2px; }
        .tab:hover .tab-close { opacity: 0.6; }
        .tab-close:hover { background: rgba(0,0,0,0.2); opacity: 1; }

        /* Editor Wrapper */
        .editor-wrapper { flex: 1; position: relative; display: flex; overflow: hidden; }
        .editor-container { flex: 1; position: relative; overflow: hidden; }
        
        .minimap-container {
            width: 60px; border-left: 1px solid var(--mac-border);
            position: relative; overflow: hidden; opacity: 0.6;
            display: none; background: var(--mac-bg-app);
        }
        @media (min-width: 768px) { .minimap-container { display: block; } }
        .minimap-content {
            transform: scale(0.15); transform-origin: top left;
            width: 666%; height: 100%; pointer-events: none;
        }

        /* CodeMirror Customization for Mac Look */
        .CodeMirror { 
            font-family: 'JetBrains Mono', Menlo, Monaco, 'Courier New', monospace; 
            font-size: 13px; line-height: 1.6;
            background: transparent !important; 
        }
        .cm-s-dracula.CodeMirror { background: var(--mac-bg-app) !important; color: var(--mac-text-primary) !important; }
        .CodeMirror-gutters { background: var(--mac-bg-app) !important; border-right: 1px solid var(--mac-border) !important; }
        .CodeMirror-linenumber { color: var(--mac-text-secondary) !important; }

        /* --- PREVIEW & CONSOLE --- */
        .preview-container {
            width: var(--panel-right-width); 
            border-left: 1px solid var(--mac-border); display: flex; flex-direction: column;
            background: var(--mac-bg-app); overflow: hidden; flex-shrink: 0;
            transition: width 0.3s ease;
        }
        .preview-container.collapsed { width: 0; border-left: none; }

        .preview-header {
            padding: 0 12px; height: 38px; background: var(--mac-bg-app); color: var(--mac-text-secondary);
            font-size: 11px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--mac-border); letter-spacing: 0.5px;
        }

        iframe { flex: 1; border: none; width: 100%; background: #fff; }
        
        /* Mac Terminal Style Console */
        .console-panel {
            height: 180px; background: #121212; border-top: 1px solid var(--mac-border);
            display: flex; flex-direction: column; font-family: 'JetBrains Mono', monospace;
        }
        .console-header {
            padding: 6px 12px; background: #1c1c1c; color: #888; font-size: 11px;
            display: flex; justify-content: space-between; border-bottom: 1px solid #333;
        }
        .console-body { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; color: #eee; }
        .log-entry { margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
        .log-entry.error { color: var(--traffic-red); }
        .log-entry.warn { color: var(--traffic-yellow); }
        .log-entry.log { color: #dcdcdc; }
        .log-entry.system { color: var(--mac-accent); }
        .log-time { color: #555; font-size: 10px; margin-right: 8px; }

        /* Footer */
        footer {
            height: 28px; background: var(--mac-bg-app); border-top: 1px solid var(--mac-border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
            font-size: 11px; color: var(--mac-text-secondary);
        }

        /* --- MODAL (Mac Sheet Style) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
            z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding-top: 100px;
        }
        .modal {
            background: var(--mac-bg-app); padding: 20px; border-radius: 12px; width: 380px;
            border: 1px solid var(--mac-border); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal h3 { margin-bottom: 15px; font-size: 16px; color: var(--mac-text-primary); font-weight: 600; text-align: center; }
        .modal input, .modal select {
            width: 100%; padding: 8px 10px; margin-bottom: 15px; background: rgba(128,128,128,0.1);
            border: 1px solid transparent; color: var(--mac-text-primary); border-radius: 6px; font-size: 13px;
        }
        .modal input:focus, .modal select:focus { border-color: var(--mac-accent); background: rgba(128,128,128,0.05); }
        
        .modal-btns { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .modal-btns .btn { width: 100px; background: rgba(128,128,128,0.2); }
        .modal-btns .btn-run { background: var(--mac-accent); color: white; }
        .modal-btns .btn-run:hover { background: #006add; }

        /* Zen Mode Button */
        #exit-zen-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10000;
            background: rgba(50,50,50,0.8); backdrop-filter: blur(10px); color: white; padding: 10px 24px;
            border-radius: 20px; border: 1px solid #555; font-size: 13px; cursor: pointer; display: none;
        }
        body.zen-mode header, body.zen-mode footer, body.zen-mode .sidebar, body.zen-mode .tab-bar, body.zen-mode .console-panel { display: none !important; }
        body.zen-mode .workspace { position: fixed; inset: 0; z-index: 9999; }
        body.zen-mode .preview-container { width: 50%; }
        body.zen-mode .preview-container.collapsed { width: 0; } 
        body.zen-mode #exit-zen-btn { display: block; }

        /* Responsive */
        @media (max-width: 768px) {
            .workspace { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--mac-border); }
            .preview-container { width: 100%; height: 350px; border-left: none; border-top: 1px solid var(--mac-border); }
            .btn-text span { display: none; }
            .app-title { display: none; }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo"><i class="fas fa-layer-group" style="font-size: 2rem;"></i> FerCy Side<span>Studio</span></div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <div style="margin-top: 15px; color: #666; font-size: 0.8rem; font-family: -apple-system, sans-serif;">Initializing Environment...</div>
    </div>

    <button id="exit-zen-btn" onclick="toggleZenMode()">Exit Full Screen</button>

    <div class="modal-overlay" id="file-modal">
        <div class="modal">
            <h3>New File</h3>
            <input type="text" id="new-filename" placeholder="Filename (e.g. script.py)">
            <select id="template-select">
                <option value="blank">Blank File</option>
                <option value="python">Python Script 🐍</option>
                <option value="basic">HTML5 Boilerplate</option>
                <option value="tailwind">Tailwind CSS</option>
            </select>
            <div class="modal-btns">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-run" onclick="confirmNewFile()">Create</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <div class="mac-traffic-lights">
                <div class="mac-dot mac-red"></div>
                <div class="mac-dot mac-yellow"></div>
                <div class="mac-dot mac-green" onclick="toggleZenMode()"></div>
            </div>
            
            <i class="fas fa-sidebar toggle-btn" id="toggle-left-btn" title="Toggle Sidebar" style="margin-left: 15px;"></i>
            <i class="fas fa-columns toggle-btn" id="toggle-right-btn" title="Toggle Preview"></i>
        </div>

        <div class="app-title">
            <i class="fas fa-code"></i> FerCy Side Studio
        </div>
        
        <div class="controls">
            <button class="btn btn-text" id="add-file-btn" title="New File">
                <i class="fas fa-plus"></i>
            </button>
            
            <button class="btn" id="zip-btn" title="Export">
                <i class="fas fa-arrow-up-from-bracket"></i>
            </button>
            
            <button class="btn" id="format-btn" title="Format">
                <i class="fas fa-align-left"></i>
            </button>

            <button class="btn" id="record-btn" title="Record">
                <div class="recording-dot"></div>
                <i class="fas fa-video"></i>
            </button>

            <button class="btn" id="theme-btn" title="Theme">
                <i class="fas fa-circle-half-stroke"></i>
            </button>

            <div style="width: 1px; height: 16px; background: var(--mac-border); margin: 0 4px;"></div>

            <button class="btn btn-run btn-text" id="run-btn">
                <i class="fas fa-play"></i> <span>Run</span>
            </button>
        </div>
    </header>

    <div class="workspace">
        
        <aside class="sidebar" id="sidebar-panel">
            <div class="sidebar-header">Explorer</div>
            <ul class="file-list" id="file-list-container"></ul>
        </aside>

        <div class="main-area">
            <div class="tab-bar" id="tab-bar-container"></div>
            
            <div class="editor-wrapper">
                <div class="editor-container">
                    <textarea id="code-editor"></textarea>
                </div>
                <div class="minimap-container">
                    <div class="minimap-content" id="minimap-content"></div>
                </div>
            </div>
        </div>

        <div class="preview-container" id="preview-panel">
            <div class="preview-header">
                <span id="output-label">Preview</span>
                <i class="fas fa-rotate-right" onclick="document.getElementById('run-btn').click()" style="cursor: pointer; font-size: 12px;"></i>
            </div>
            <iframe id="web-preview"></iframe>
            
            <div class="console-panel" id="custom-console">
                <div class="console-header">
                    <span>Terminal</span>
                    <i class="fas fa-ban" style="cursor: pointer;" title="Clear" onclick="clearConsole()"></i>
                </div>
                <div class="console-body" id="console-logs">
                    <div class="log-entry system"><span class="log-time">SYS</span> Ready.</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="left" id="status-bar" style="display: flex; gap: 15px;">
            <span><i class="fas fa-code-branch" style="margin-right:5px"></i>main</span>
            <span id="status-text">Ready</span>
        </div>
        <div class="right" id="python-status">Initializing Python...</div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/xml-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/dialog/dialog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/search.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/search/jump-to-line.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/codemirror-emmet@1.0.6/dist/codemirror-emmet.min.js"></script>

    <script>
        // --- KONFIGURASI ---
        const STORAGE_KEY = 'fercy_mac_edition_v3_fixed';
        const SPLASH_TIMEOUT_MS = 2500; // Paksa masuk UI setelah 2.5 detik apapun yang terjadi

        // --- DATA DEFAULT ---
        let savedData = localStorage.getItem(STORAGE_KEY);
        let files = savedData ? JSON.parse(savedData) : [
            { 
                id: 1, name: 'index.html', lang: 'htmlmixed', 
                content: '<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { background: #fff; color: #333; font-family: -apple-system, sans-serif; text-align: center; padding-top: 50px; }\n    h1 { font-weight: 800; letter-spacing: -1px; }\n  </style>\n</head>\n<body>\n  <h1>FerCy Side Studio</h1>\n  <p>Running on Live Server Success!</p>\n  <script>\n    console.log("System Ready.");\n  <\/script>\n</body>\n</html>' 
            },
            {
                id: 2, name: 'main.py', lang: 'python',
                content: '# Python Script\n\ndef greeting(name):\n    return f"Hello {name}, running on WebAssembly!"\n\nprint(greeting("Developer"))\n\nfor i in range(3):\n    print(f"Processing data... {i+1}")'
            }
        ];
        
        let activeFileId = files[0].id;
        let openFiles = [files[0].id];
        let mainEditor, minimapEditor; 
        let pyodideInstance = null; 

        // --- FUNGSI HIDE SPLASH SCREEN (SAFETY) ---
        function forceHideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('splash-hidden')) {
                splash.classList.add('splash-hidden');
            }
        }

        // --- INIT PYODIDE ENGINE ---
        async function initPyodide() {
            try {
                // Update UI status
                addToConsole('system', 'Initializing Python Kernel...');
                
                // Cek protocol file://
                if (window.location.protocol === 'file:') {
                    addToConsole('warn', '⚠️ Running on file:// protocol. Python might be blocked.');
                    document.getElementById('python-status').innerHTML = '<i class="fas fa-exclamation-circle" style="color:orange"></i> Restricted';
                }

                // Load Pyodide
                pyodideInstance = await loadPyodide({
                    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.23.4/full/"
                });
                
                await pyodideInstance.loadPackage("micropip");

                // Sukses
                document.getElementById('python-status').innerHTML = '<i class="fas fa-check-circle" style="color: #28C840"></i> Python Ready';
                addToConsole('system', 'Python Engine Loaded Successfully.');
                
            } catch (err) {
                document.getElementById('python-status').innerHTML = '<i class="fas fa-exclamation-triangle" style="color: #FF5F57"></i> Error';
                addToConsole('error', 'Gagal memuat Pyodide (Network/CORS Error): ' + err.message);
                console.error(err);
            } finally {
                // Pastikan splash screen tertutup setelah proses init selesai (sukses/gagal)
                forceHideSplash();
            }
        }

        // --- INIT SYSTEM (MAIN ENTRY POINT) ---
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. SAFETY NET: Paksa splash screen hilang setelah timeout (misal koneksi lambat)
            setTimeout(forceHideSplash, SPLASH_TIMEOUT_MS);

            // 2. Load Editor UI
            initEditors();

            // 3. Load Python di background
            initPyodide();
        });

        function initEditors() {
            // Main Editor Setup
            mainEditor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                lineNumbers: true,
                theme: 'dracula',
                mode: 'htmlmixed',
                autoCloseTags: true,
                autoCloseBrackets: true,
                extraKeys: {
                    "Ctrl-Space": "autocomplete",
                    "Tab": "emmetExpandAbbreviation",
                    "Esc": "emmetResetAbbreviation",
                    "Enter": "emmetInsertLineBreak",
                    "Ctrl-F": "findPersistent"
                },
                emmet: { preview: true }
            });

            // Minimap Editor Setup
            minimapEditor = CodeMirror(document.getElementById('minimap-content'), {
                value: mainEditor.getValue(),
                mode: 'htmlmixed',
                theme: 'dracula',
                lineNumbers: false,
                readOnly: "nocursor",
                scrollbarStyle: "null"
            });

            // Sync Logic
            mainEditor.on('change', () => {
                const val = mainEditor.getValue();
                minimapEditor.setValue(val);
                const currentFile = files.find(f => f.id === activeFileId);
                if(currentFile) {
                    currentFile.content = val;
                    saveToStorage();
                }
            });

            mainEditor.on('scroll', () => {
                const info = mainEditor.getScrollInfo();
                const percentage = info.top / (info.height - info.clientHeight);
                const miniInfo = minimapEditor.getScrollInfo();
                minimapEditor.scrollTo(0, percentage * (miniInfo.height - miniInfo.clientHeight));
            });

            renderFileList();
            renderTabs();
            switchFile(activeFileId);
        }

        // --- SLIDING PANEL LOGIC ---
        const sidebarPanel = document.getElementById('sidebar-panel');
        const previewPanel = document.getElementById('preview-panel');
        const toggleLeftBtn = document.getElementById('toggle-left-btn');
        const toggleRightBtn = document.getElementById('toggle-right-btn');

        toggleLeftBtn.addEventListener('click', () => {
            sidebarPanel.classList.toggle('collapsed');
            setTimeout(() => mainEditor.refresh(), 350);
        });

        toggleRightBtn.addEventListener('click', () => {
            previewPanel.classList.toggle('collapsed');
            setTimeout(() => mainEditor.refresh(), 350);
        });

        function saveToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(files)); }

        // --- FILE & TABS SYSTEM ---
        function getIconForFile(filename) {
            if(filename.endsWith('.py')) return '<i class="fab fa-python" style="color:#FFD43B"></i>';
            if(filename.endsWith('.css')) return '<i class="fab fa-css3" style="color:#0A84FF"></i>';
            if(filename.endsWith('.js')) return '<i class="fab fa-js" style="color:#FFD60A"></i>';
            return '<i class="fab fa-html5" style="color:#FF3B30"></i>';
        }

        function renderFileList() {
            const container = document.getElementById('file-list-container');
            container.innerHTML = '';
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
                li.onclick = () => openFile(file.id);
                li.innerHTML = `<div class="file-icon">${getIconForFile(file.name)}</div><span>${file.name}</span>
                    <div class="file-actions"><i class="fas fa-xmark delete-btn" onclick="deleteFile(event, ${file.id})"></i></div>`;
                container.appendChild(li);
            });
        }

        function renderTabs() {
            const container = document.getElementById('tab-bar-container');
            container.innerHTML = '';
            openFiles.forEach(id => {
                const file = files.find(f => f.id === id);
                if(!file) return;
                const tab = document.createElement('div');
                tab.className = `tab ${id === activeFileId ? 'active' : ''}`;
                tab.onclick = () => switchFile(id);
                tab.innerHTML = `${getIconForFile(file.name)} ${file.name} 
                    <i class="fas fa-times tab-close" onclick="closeTab(event, ${id})"></i>`;
                container.appendChild(tab);
            });
        }

        function openFile(id) {
            if(!openFiles.includes(id)) openFiles.push(id);
            switchFile(id);
        }

        function switchFile(id) {
            const currentFile = files.find(f => f.id === activeFileId);
            if(currentFile && mainEditor) currentFile.content = mainEditor.getValue();

            activeFileId = id;
            const nextFile = files.find(f => f.id === activeFileId);
            if(nextFile && mainEditor) {
                mainEditor.setValue(nextFile.content);
                minimapEditor.setValue(nextFile.content);
                document.getElementById('status-text').innerText = `Editing: ${nextFile.name}`;

                if (nextFile.name.endsWith('.py')) {
                    mainEditor.setOption("mode", "python");
                    minimapEditor.setOption("mode", "python");
                    document.getElementById('output-label').innerHTML = 'Terminal Output';
                } else {
                    mainEditor.setOption("mode", "htmlmixed");
                    minimapEditor.setOption("mode", "htmlmixed");
                    document.getElementById('output-label').innerHTML = 'Web Preview';
                }
            }
            renderFileList();
            renderTabs();
        }

        function closeTab(e, id) {
            e.stopPropagation();
            openFiles = openFiles.filter(fid => fid !== id);
            if(openFiles.length === 0 && files.length > 0) openFiles.push(files[0].id);
            if(activeFileId === id) switchFile(openFiles[openFiles.length - 1]);
            else renderTabs();
        }

        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            mainEditor.refresh();
        }

        document.getElementById('zip-btn').onclick = function() {
            const zip = new JSZip();
            const currentFile = files.find(f => f.id === activeFileId);
            if(currentFile) currentFile.content = mainEditor.getValue();

            files.forEach(file => { zip.file(file.name, file.content); });
            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "FerCy_Mac_Project.zip");
            });
        };

        const modal = document.getElementById('file-modal');
        const addBtn = document.getElementById('add-file-btn');
        const filenameInput = document.getElementById('new-filename');
        const templateSelect = document.getElementById('template-select');

        addBtn.onclick = () => { modal.style.display = 'block'; filenameInput.focus(); }
        function closeModal() { modal.style.display = 'none'; filenameInput.value = ''; }

        const TEMPLATES = {
            'blank': '',
            'python': '# Python Script\nprint("Hello from macOS Web Environment")\n',
            'basic': '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>Document</title>\n</head>\n<body>\n  <h1>Hello World</h1>\n</body>\n</html>',
            'tailwind': '<!DOCTYPE html>\n<html>\n<head>\n  <script src="https://cdn.tailwindcss.com"><\/script>\n</head>\n<body class="bg-gray-100 flex items-center justify-center h-screen">\n  <h1 class="text-3xl font-bold text-blue-600">Hello Tailwind!</h1>\n</body>\n</html>'
        };

        function confirmNewFile() {
            const name = filenameInput.value.trim();
            const tmplKey = templateSelect.value;
            if(!name) return alert("Filename cannot be empty.");
            
            const newFile = { 
                id: Date.now(), 
                name: name, 
                lang: name.endsWith('.py') ? 'python' : 'htmlmixed', 
                content: TEMPLATES[tmplKey] || TEMPLATES['blank']
            };
            files.push(newFile);
            saveToStorage();
            closeModal();
            openFile(newFile.id);
        }

        document.getElementById('format-btn').onclick = () => {
            try {
                const currentFile = files.find(f => f.id === activeFileId);
                let formatted;
                if(currentFile && currentFile.name.endsWith('.py')) {
                   alert("Python formatting not supported yet.");
                   return;
                } else {
                   formatted = prettier.format(mainEditor.getValue(), { parser: "html", plugins: prettierPlugins });
                }
                mainEditor.setValue(formatted);
            } catch(e) { alert("Code error, cannot format."); }
        };

        window.deleteFile = function(e, id) {
            e.stopPropagation(); 
            if(files.length <= 1) return alert("Keep at least one file.");
            if(confirm('Delete file?')) {
                files = files.filter(f => f.id !== id);
                closeTab(e, id);
                renderFileList();
                saveToStorage();
            }
        };

        // --- RUN LOGIC ---
        document.getElementById('run-btn').onclick = async () => {
            const activeFile = files.find(f => f.id === activeFileId);
            activeFile.content = mainEditor.getValue();
            saveToStorage();

            clearConsole();

            if (activeFile.name.endsWith('.py')) {
                // Check if Python engine is actually ready
                if (!pyodideInstance) {
                    addToConsole('warn', '⏳ Python Engine is still initializing or failed to load.');
                    addToConsole('system', 'Attempting to re-initialize...');
                    // Retry init if user clicks run
                    initPyodide();
                    return;
                }
                
                document.getElementById('web-preview').srcdoc = "<html><body style='color:#666; font-family:-apple-system, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh;'>Running Python...</body></html>";
                addToConsole('system', 'Running Script...');
                
                try {
                    pyodideInstance.setStdout({ batched: (msg) => {
                        addToConsole('log', msg);
                    }});
                    
                    await pyodideInstance.runPythonAsync(activeFile.content);
                    addToConsole('system', 'Finished.');
                } catch (err) {
                    addToConsole('error', 'Runtime Error: ' + err);
                }

            } else {
                const webPreview = document.getElementById('web-preview');
                const scriptInterception = `<script>
                    (function(){
                        const send = (type, args) => {
                            const msg = Array.from(args).join(' ');
                            window.parent.postMessage({source:'fercy', type, message:msg}, '*');
                        };
                        console.log = (...a) => send('log', a);
                        console.warn = (...a) => send('warn', a);
                        console.error = (...a) => send('error', a);
                        window.onerror = (m,u,l) => send('error', [m]);
                    })();
                <\/script>`;

                const doc = webPreview.contentWindow.document;
                doc.open();
                doc.write(scriptInterception + activeFile.content);
                doc.close();
            }
        };

        function addToConsole(type, message) {
            const logs = document.getElementById('console-logs');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit' });
            logs.innerHTML += `<div class="log-entry ${type}"><span class="log-time">${time}</span> ${message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        window.addEventListener('message', (e) => {
            if(e.data && e.data.source === 'fercy') {
                addToConsole(e.data.type, e.data.message);
            }
        });
        
        function clearConsole() { document.getElementById('console-logs').innerHTML = ''; }

        let isDarkMode = true;
        document.getElementById('theme-btn').onclick = () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode');
            mainEditor.setOption('theme', isDarkMode ? 'dracula' : 'eclipse');
            minimapEditor.setOption('theme', isDarkMode ? 'dracula' : 'eclipse');
        };

        window.addEventListener('resize', () => mainEditor.refresh());
    </script>
</body>
</html>
